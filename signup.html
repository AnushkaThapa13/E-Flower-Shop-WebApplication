<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>


<nav class="navbar navbar-dark bg-black px-3">
    <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="florian.png" class="brand-logo">
        <span class="brand-name ms-2">Florian Florist</span>
    </a>
</nav>


<div class="main-content">
    <div class="login-card">

        <h3 class="text-center mb-3">Customer Login</h3>

        <form>
            <input type="text" class="form-control mb-3" placeholder="Full Name">
            <input type="email" class="form-control mb-3" placeholder="Email">
            <input type="password" class="form-control mb-3" placeholder="Password">
            <button type="button" onclick="loginUser()" class="btn btn-primary w-100">Login</button>

            
        </form>

       
        <p class="text-center mt-3">
            New user? <a href="signup.html">Sign up</a>
        </p>

    </div>
</div>
<script src="home.js"></script>
</body>
</html>
