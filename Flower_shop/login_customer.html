<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<nav class="navbar navbar-dark bg-black px-3">
    <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
        <img src="florian.png" class="brand-logo" alt="Logo" style="height: 40px;">
        <span class="brand-name ms-2">Florian Florist</span>
    </a>
</nav>

<div class="main-content">
    <div class="login-card">

        <h3 class="text-center mb-3">Customer Login</h3>

        <form onsubmit="executeCustomerLogin(event)">
            <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Email" required>
            <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password" required>
            
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p class="text-center mt-3 mb-0">
            New user? <a href="signup.html">Sign up</a>
        </p>

    </div>
</div>

<script src="dashboard.js"></script>

<script>
function executeCustomerLogin(event) {
    // Stop the page from reloading out of context
    event.preventDefault();

    // Pull the text values right out of your inputs
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    // Fire the shared system script processing logic directly!
    loginUser(email, password);
}
</script>

</body>
</html>
