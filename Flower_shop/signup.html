<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Signup</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black px-3">
        <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
            <img src="florian.png" class="brand-logo" alt="Florian Logo">
            <span class="brand-name ms-2">Florian Florist</span>
        </a>
    </nav>

    <!-- Signup Form -->
    <div class="main-content d-flex justify-content-center align-items-center vh-100">

        <div class="card p-4 shadow" style="width: 400px;">

            <h3 class="text-center mb-3">Sign Up</h3>

            <form onsubmit="signupuser(); return false;">

                <input 
                    type="text" 
                    class="form-control mb-3" 
                    placeholder="Full Name"
                    required
                >

                <input 
                    type="email" 
                    class="form-control mb-3" 
                    placeholder="Email"
                    required
                >

                <input 
                    type="password" 
                    class="form-control mb-3" 
                    placeholder="Password"
                    required
                >

                <input 
                    type="password" 
                    class="form-control mb-3" 
                    placeholder="Confirm Password"
                    required
                >

                <button type="submit" class="btn btn-primary w-100">
                    Sign Up
                </button>

            </form>

            <p class="text-center mt-3">
                Already have an account?
                <a href="login_customer.html">Login</a>
            </p>

        </div>

    </div>

    
    <script src="signup.js"></script>

</body>
</html>
