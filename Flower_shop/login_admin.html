<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="login_admin.css">
</head>
<body>

    <navbar class="navbar navbar-dark bg-black px-3">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="florian.png" class="brand-logo">
            <span class="brand-name ms-2">Florian Florist</span>
        </a>
    </navbar>

    <div class="main-content">
        <div class="login-card">
            <h3 class="text-center mb-3">ADMIN Login</h3>
            <form onsubmit="handleAdminLogin(event)">
                <input type="email" id="adminEmail" class="form-control mb-3" placeholder="Email" required>
                <input type="password" id="adminPassword" class="form-control mb-3" placeholder="Password" required>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>

    <script src="adminlogin.js"></script>
    
</body>
</html>
